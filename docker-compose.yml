services:
  # Database Service: MongoDB
  mongo:
    image: mongo:6-jammy
    container_name: techstore-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # Backend Service: Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/filmdb
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - app-network

  # Frontend Service: React + Nginx
  techstore-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techstore-frontend
    restart: always
    ports:
      - "80:3000"
      - "3007:3000"
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge